services:
  train:
    build:
      context: ./model
    image: gaze-model:dev

    # GPU passthrough (Linux hosts only Docker on macOS has no GPU support at
    # all).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    volumes:
      - ./data:/data
      - ./model/checkpoints:/app/checkpoints

    environment:
      - PYTHONUNBUFFERED=1

    entrypoint: ["bash", "-c"]
    command:
      - |
        if [ ! -e /data/MPIIFaceGaze ]; then
          echo "Unpacking /data/MPIIFaceGaze.tar.gz -> /data ..."
          tar -xzf /data/MPIIFaceGaze.tar.gz -C /data
        fi
        exec uv run train.py

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: ac215-ui:latest
    ports:
      - "8080:80"
    restart: unless-stopped
