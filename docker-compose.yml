# Services:
#
#     docker compose up              serve the web UI
#     docker compose run --rm train  build the cache and train
#
# `train` is a job that runs to completion; `ui` is a long-lived server, and
# the UI consumes nothing training produces. The profile keeps training
# opt-in so `up` does not retrain whenever someone wants the app. `compose
# run` enables the profile itself, so the training command needs no flag.

services:
  train:
    profiles: ["train"]
    build:
      context: ./model
    image: gaze-model:dev

    # PyTorch's DataLoader passes tensors between worker processes through
    # /dev/shm. Docker defaults that to 64MB, which a batch of 224x224 images
    # overruns instantly -- and the resulting error reads "No space left on
    # device", which looks like a full disk but is not. This is a property of
    # the sandbox, not the image, so it cannot live in the Dockerfile.
    shm_size: 2gb

    volumes:
      - ./data:/data
      - ./model/checkpoints:/app/checkpoints

    environment:
      - PYTHONUNBUFFERED=1

    # No `command`: train.py's own defaults apply, so they are defined in one
    # place. Override per run: `docker compose run --rm train --epochs 1`

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: ac215-ui:latest
    ports:
      - "8080:80"
    restart: unless-stopped
