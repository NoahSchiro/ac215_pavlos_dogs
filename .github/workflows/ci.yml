name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  model:
    name: model (mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries required by mediapipe
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2 libgl1
      - uses: astral-sh/setup-uv@v5
        with:
          working-directory: model
      - run: uv sync
      - run: uv run mypy .
      - run: uv run ruff check .
      - run: uv run pytest --cov=. --cov-fail-under=70
      # The TypeScript port in ui/src/vision is checked against fixtures
      # recorded from this pipeline. Regenerate them here and fail if they
      # have drifted, so preprocessing cannot change without the browser's
      # reference changing with it.
      - name: Parity fixtures are current
        run: uv run python tools/gen_parity_fixtures.py --check

  ui:
    name: ui (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Test (jsdom project; vision needs a desktop browser)
        run: npm test -- --project app

  proposal:
    name: proposal (typst compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proposal
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v3
      - run: typst compile main.typ

  containers:
    name: containers (build + compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the model image
        run: docker build -t gaze-model:ci ./model

      - name: Build the UI image
        run: docker build -t ac215-ui:ci ./ui

      - name: Validate the compose file
        run: docker compose config --quiet
