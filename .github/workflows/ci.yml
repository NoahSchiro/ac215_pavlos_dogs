name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  model:
    name: model (mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries required by mediapipe
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2 libgl1
      - uses: astral-sh/setup-uv@v5
        with:
          working-directory: model
      - run: uv sync
      - run: uv run mypy .
      - run: uv run ruff check .
      - run: uv run pytest --cov=. --cov-fail-under=70

  ui:
    name: ui (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Test (jsdom project; vision needs a desktop browser)
        run: npm test -- --project app

  proposal:
    name: proposal (typst compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proposal
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v3
      - run: typst compile main.typ

  containers:
    name: containers (build + compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nothing built these before, so a Dockerfile could break without CI
      # noticing until someone tried to run the pipeline.
      - name: Build the model image
        run: docker build -t gaze-model:ci ./model

      - name: Build the UI image
        run: docker build -t ac215-ui:ci ./ui

      # Catches a malformed compose file, and catches a service going missing
      # if a second compose file is ever added (compose silently reads only
      # the highest-precedence one).
      - name: Validate the compose file
        run: |
          docker compose config --quiet

          # `up` must bring up the app only. If `train` ever appears here, a
          # bare `docker compose up` would start a training run.
          default=$(docker compose config --services | sort | tr '\n' ' ')
          echo "default profile: $default"
          test "$default" = "ui " || {
            echo "expected 'ui ', got '$default'"; exit 1; }

          # Both services must still be defined. This also catches a second
          # compose file being added: compose silently reads only the
          # highest-precedence one and the other's services vanish.
          all=$(docker compose --profile train config --services | sort | tr '\n' ' ')
          echo "with train profile: $all"
          test "$all" = "train ui " || {
            echo "expected 'train ui ', got '$all'"; exit 1; }
